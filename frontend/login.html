
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login | Meu Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="login-logo">✦</div>

        <h1>Meu Financeiro</h1>
        <p>Organize suas finanças com estilo.</p>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                required
            >

            <button type="submit">
                Entrar na minha conta
            </button>
        </form>

        <p id="mensagem" role="alert"></p>

        <p class="login-footer">
            Ainda não tem uma conta?
            <a href="#" id="mostrarCadastro">
                Cadastre-se
            </a>
        </p>

        <form id="cadastroForm" hidden>
            <label for="nomeCadastro">Nome</label>
            <input id="nomeCadastro" required>

            <label for="emailCadastro">E-mail</label>
            <input id="emailCadastro" type="email" required>

            <label for="senhaCadastro">Senha</label>
            <input id="senhaCadastro"
                   type="password" minlength="8" required>

            <button type="submit">Criar conta</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
